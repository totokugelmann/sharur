name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sharur
          POSTGRES_PASSWORD: sharur
          POSTGRES_DB: sharur_saic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql+psycopg2://sharur:sharur@localhost:5432/sharur_saic_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci_test_secret_key
      NETWORK_CONTROL_BACKEND: noop

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Type check (mypy, no estricto)
        run: mypy app --ignore-missing-imports || true

      - name: Run tests
        run: pytest tests/unit tests/integration -v
